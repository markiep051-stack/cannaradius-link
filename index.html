<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CannaRadius</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CannaRadius">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<style>
 body{margin:0;min-height:100svh;display:grid;place-items:center;padding:1.5rem;
      background:#050906;color:#d6f5df;text-align:center;color-scheme:dark;
      font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
 img{width:92px;height:92px}
 h1{font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;
    color:#4dff88;margin:1.1rem 0 .3rem}
 p{color:#6f9a7d;margin:0 0 1.2rem;max-width:26rem}
 code{display:block;padding:.85rem 1rem;margin:0 auto 1rem;max-width:26rem;
      background:#0a120c;border:1px solid #16301d;border-radius:12px;
      color:#d6f5df;font-size:.9rem;word-break:break-all}
 a.go{display:inline-block;padding:.75rem 1.4rem;border-radius:12px;
      background:#0f3d22;border:1px solid #1f7a45;color:#eafff1;
      text-decoration:none;font-weight:600}
 button{margin-left:.5rem;padding:.75rem 1.1rem;border-radius:12px;
        background:#0a120c;border:1px solid #16301d;color:#6f9a7d;
        font:inherit;cursor:pointer}
 button:hover{color:#4dff88;border-color:#1f7a45}
</style>
<div>
  <img src="icon-192.png" alt="">
  <h1>CannaRadius</h1>
  <p id="note">Opening the radar…</p>
  <code id="addr">https://bio-allows-interracial-gary.trycloudflare.com</code>
  <a class="go" id="go" href="https://bio-allows-interracial-gary.trycloudflare.com">Open the radar</a>
  <button type="button" id="copy">Copy address</button>
</div>
<script>
 var here = "https://bio-allows-interracial-gary.trycloudflare.com";
 // ?stay holds the page open instead of forwarding, so the current address can
 // be read and copied — which is what you need when the tunnel has moved and
 // the installed app is pointing at the old one.
 var stay = location.search.indexOf("stay") >= 0 || location.hash.indexOf("stay") >= 0;
 document.getElementById("note").textContent = stay
   ? "This is where the radar is right now. Install from this address."
   : "Opening the radar\u2026";
 document.getElementById("copy").addEventListener("click", function () {
   navigator.clipboard.writeText(here).then(function () {
     document.getElementById("copy").textContent = "Copied";
   });
 });
 if (!stay) location.replace(here);
</script>
